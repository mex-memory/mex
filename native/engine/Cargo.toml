# The MEX graph engine (OSS-73): one Rust program that parses, extracts,
# resolves and writes the code graph for every language. Node orchestrates it;
# see docs/design/graph-engine-contract.md for the interface.
[workspace]
resolver = "3"
members = ["core", "engine", "langs/csharp", "langs/ecmascript", "langs/python", "langs/rust", "langs/syntax"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
