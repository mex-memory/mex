[package]
name = "mex-graph-ecmascript"
description = "The ECMAScript adapter for the MEX graph engine."
version.workspace = true
edition.workspace = true
license = "MIT AND Apache-2.0 AND Unicode-DFS-2016"
publish.workspace = true
rust-version.workspace = true

[dependencies]
mex-graph-core = { path = "../../core" }
tree-sitter = "0.26"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
serde_json = { version = "=1.0.154", features = ["preserve_order", "raw_value"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
