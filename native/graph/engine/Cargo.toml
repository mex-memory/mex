[package]
name = "mex-graph"
description = "The MEX graph engine binary."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "mex-graph"
path = "src/main.rs"

[dependencies]
memory-stats = "1"
mex-graph-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1"
