name: Release

on:
  push:
    tags: ['v0.9.0*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse without publishing
        type: boolean
        default: true
      require_gates:
        description: Require passing same-commit release gates (only dry runs may skip)
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/gates.yml'
      - 'scripts/release/**'
      - 'scripts/gates/**'
      - 'npm/**'
      - 'scripts/build-hook-binaries.mjs'
      - 'scripts/build-graph-package.mjs'
      - 'scripts/build-graph-wasi.sh'
      - 'scripts/copy-graph-assets.mjs'
      - 'native/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/hooks/shim/**'
      - 'src/graph/**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      json: ${{ steps.plan.outputs.json }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      require_gates: ${{ steps.plan.outputs.require_gates }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Decide version, mode and publish order
        id: plan
        env:
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_REQUIRE_GATES: ${{ inputs.require_gates }}
        run: node scripts/release/cli.mjs plan

  gate-checks:
    needs: plan
    if: needs.plan.outputs.require_gates == 'true'
    uses: ./.github/workflows/gates.yml
    with:
      release: ${{ needs.plan.outputs.release }}

  release-gates:
    # Authorization can pass for a rehearsal; only the reusable workflow
    # produces passing gate evidence. Keep the UI distinction explicit.
    name: Release authorization
    needs: [plan, gate-checks]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gate_result: ${{ steps.verdict.outputs.gate_result }}
      gate_commit: ${{ steps.verdict.outputs.gate_commit }}
    env:
      RELEASE_PLAN: ${{ needs.plan.outputs.json }}
      RELEASE_GATE_RESULT: ${{ needs.gate-checks.result }}
      RELEASE_GATE_COMMIT: ${{ needs.gate-checks.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Authorize or prove the missing-gates refusal
        id: verdict
        run: node scripts/release/cli.mjs authorize

  graph-binaries:
    needs: [plan, release-gates]
    if: always() && needs.plan.result == 'success' && needs.release-gates.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: windows-2022, target: win32-x64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build unsigned graph binary on its target
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: node scripts/build-graph-package.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: graph-${{ matrix.target }}
          path: npm/graph-${{ matrix.target }}/bin/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: [plan, release-gates, graph-binaries]
    if: always() && needs.plan.result == 'success' && needs.release-gates.result == 'success' && needs.graph-binaries.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    env:
      RELEASE_PLAN: ${{ needs.plan.outputs.json }}
      RELEASE_GATE_RESULT: ${{ needs.release-gates.outputs.gate_result }}
      RELEASE_GATE_COMMIT: ${{ needs.release-gates.outputs.gate_commit }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - run: node scripts/release/cli.mjs npm "$RUNNER_TEMP/release-npm"
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: node --test scripts/release/*.test.mjs
      - run: npm run build
      - run: node scripts/build-hook-binaries.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: graph-*
          path: ${{ runner.temp }}/graph-binaries
      - name: Stage native graph packages
        run: |
          for artifact in "$RUNNER_TEMP"/graph-binaries/graph-*; do
            mkdir -p "npm/$(basename "$artifact")/bin"
            cp -a "$artifact"/. "npm/$(basename "$artifact")/bin/"
          done
          chmod +x npm/graph-*/bin/mex-graph
      - name: Build and stage the WASI graph fallback
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          archive="$RUNNER_TEMP/wasi-sdk.tar.gz"
          curl -fLsS --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz -o "$archive"
          echo "87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63acafd1a0171  $archive" | sha256sum -c -
          mkdir -p "$WASI_SDK_PATH"
          tar -xzf "$archive" -C "$WASI_SDK_PATH" --strip-components=1
          (cd native/engine && rustup target add wasm32-wasip1)
          bash scripts/build-graph-wasi.sh
          node scripts/build-graph-package.mjs --wasi
      - name: Test packaged graph engines and the Go reader
        env:
          MEX_GRAPH_ENGINE: ${{ github.workspace }}/npm/graph-linux-x64/bin/mex-graph
          MEX_TEST_REAL_HOOK_BINARY: '1'
        run: >-
          npx vitest run --maxWorkers=1
          src/graph/__tests__/graph-engine-m6.test.ts
          src/graph/__tests__/build-usage-log.test.ts
          src/graph/__tests__/languages-storage.test.ts
          src/graph/__tests__/go-graph-read.test.ts
      - name: Prove Linux binaries and pack release artifacts
        run: |
          npm/hook-linux-x64/bin/mex-hook --self-test
          npm/graph-linux-x64/bin/mex-graph version
          node scripts/release/cli.mjs pack "$RUNNER_TEMP/release-bundle"
          git diff --exit-code
      - id: artifact
        run: echo "name=release-bundle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/release-bundle/
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: [plan, release-gates, build]
    if: always() && needs.release-gates.result == 'success' && needs.build.result == 'success'
    # Each runner checks that npm picks its own platform packages.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
    env:
      RELEASE_PLAN: ${{ needs.plan.outputs.json }}
      RELEASE_GATE_RESULT: ${{ needs.release-gates.outputs.gate_result }}
      RELEASE_GATE_COMMIT: ${{ needs.release-gates.outputs.gate_commit }}
    steps:
      - name: Keep temporary files on the fast disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $temp | Out-Null
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
          "npm_config_cache=$(Join-Path $env:RUNNER_TEMP 'npm-cache')" >> $env:GITHUB_ENV
          "GOCACHE=$(Join-Path $env:RUNNER_TEMP 'go-build')" >> $env:GITHUB_ENV
          "GOMODCACHE=$(Join-Path $env:RUNNER_TEMP 'go-mod')" >> $env:GITHUB_ENV
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-bundle/
      - run: node scripts/release/cli.mjs npm "${{ runner.temp }}/release-npm"
      - name: Install from a loopback registry and prove npm platform selection
        run: node scripts/release/cli.mjs smoke "${{ runner.temp }}/release-bundle"

  dry-run:
    needs: [plan, release-gates, build, smoke]
    if: always() && needs.release-gates.result == 'success' && needs.build.result == 'success' && needs.smoke.result == 'success' && needs.plan.outputs.dry_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_PLAN: ${{ needs.plan.outputs.json }}
      RELEASE_GATE_RESULT: ${{ needs.release-gates.outputs.gate_result }}
      RELEASE_GATE_COMMIT: ${{ needs.release-gates.outputs.gate_commit }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-bundle/
      - run: node scripts/release/cli.mjs npm "$RUNNER_TEMP/release-npm"
      - name: Rehearse npm and GitHub publication
        run: node scripts/release/cli.mjs dry-publish "$RUNNER_TEMP/release-bundle"

  publish:
    needs: [plan, release-gates, build, smoke]
    if: always() && needs.release-gates.result == 'success' && needs.build.result == 'success' && needs.smoke.result == 'success' && needs.plan.outputs.dry_run == 'false' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_PLAN: ${{ needs.plan.outputs.json }}
      RELEASE_GATE_RESULT: ${{ needs.release-gates.outputs.gate_result }}
      RELEASE_GATE_COMMIT: ${{ needs.release-gates.outputs.gate_commit }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-bundle/
      - run: node scripts/release/cli.mjs npm "$RUNNER_TEMP/release-npm"
      - name: Publish packages in order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release/cli.mjs publish "$RUNNER_TEMP/release-bundle"

  github-release:
    needs: [plan, release-gates, build, smoke, publish]
    if: always() && needs.release-gates.result == 'success' && needs.build.result == 'success' && needs.smoke.result == 'success' && needs.plan.outputs.dry_run == 'false' && github.event_name != 'pull_request' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_PLAN: ${{ needs.plan.outputs.json }}
      RELEASE_GATE_RESULT: ${{ needs.release-gates.outputs.gate_result }}
      RELEASE_GATE_COMMIT: ${{ needs.release-gates.outputs.gate_commit }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-bundle/
      - name: Create or complete the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/cli.mjs github "$RUNNER_TEMP/release-bundle"
