<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="setup-title setup-desc">
  <title id="setup-title">From repository to ready.</title>
  <desc id="setup-desc">The successful MEX setup path has three stages: run setup in your repository, populate project memory with your agent, then review and commit the setup checkpoint. Finish the completion guide, then explicitly open the full Hub.</desc>
