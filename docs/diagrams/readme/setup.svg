    <filter id="setup-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <marker id="setup-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#F1EEDC" stroke-width="1.4"/>
    </marker>
  </defs>
